name: Threads 自動投稿（AIサポート）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿しない（プレビューのみ）にする場合はtrueを選択'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 複数実行が同時に履歴を書き戻して衝突するのを防ぐ（直列化）
concurrency:
  group: aisupport-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # history_aisupport.json をリポジトリに書き戻すため
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール
        run: npm install

      - name: Threads に投稿
        run: node auto_post_aisupport.js
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN_AISUPPORT }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID_AISUPPORT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: 投稿履歴をリポジトリに保存（本番投稿時のみ）
        if: ${{ always() && (github.event.inputs.dry_run || 'false') != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history_aisupport.json
          if git diff --cached --quiet; then
            echo "履歴に変更なし"
          else
            git commit -m "chore: AIサポート投稿履歴を更新 [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

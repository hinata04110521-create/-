<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img" aria-label="整った姿勢でセルフケアをする女性のイラスト">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3ee"/>
      <stop offset="1" stop-color="#e4ede6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="500" height="400" fill="url(#bg)"/>

  <!-- 陽だまりの円（ひなた） -->
  <circle cx="250" cy="176" r="150" fill="#f4f8f3"/>
  <circle cx="250" cy="176" r="150" fill="none" stroke="#a4894c" stroke-width="1.1" opacity="0.55"/>
  <circle cx="250" cy="176" r="120" fill="none" stroke="#a4894c" stroke-width="0.8" opacity="0.3" stroke-dasharray="2 6"/>

  <!-- 床の影 -->
  <ellipse cx="250" cy="326" rx="126" ry="13" fill="#2f5d54" opacity="0.09"/>

  <!-- 図（パイングリーンのシルエット） -->
  <g fill="#2f5d54">
    <!-- 組んだ脚（あぐら） -->
    <path d="M150 302 Q250 250 350 302 Q302 322 250 322 Q198 322 150 302 Z"/>
    <!-- 胴（背筋の伸びたベル型） -->
    <path d="M225 196 C216 216 212 240 216 264 L284 264 C288 240 284 216 275 196 C266 187 234 187 225 196 Z"/>
    <!-- 首 -->
    <rect x="241" y="182" width="18" height="22" rx="9"/>
    <!-- 髪（まとめ髪） -->
    <circle cx="250" cy="150" r="15"/>
    <!-- 頭 -->
    <circle cx="250" cy="166" r="29"/>
  </g>

  <!-- 腕（膝に添える） -->
  <g fill="none" stroke="#2f5d54" stroke-width="15" stroke-linecap="round">
    <path d="M231 208 C209 226 196 252 184 286"/>
    <path d="M269 208 C291 226 304 252 316 286"/>
  </g>

  <!-- 整った背骨（ゴールドのドット＝アライメント） -->
  <g fill="#a4894c">
    <circle cx="250" cy="214" r="3.2"/>
    <circle cx="250" cy="228" r="3.2"/>
    <circle cx="250" cy="242" r="3.2"/>
    <circle cx="250" cy="256" r="3.2"/>
  </g>

  <!-- セルフケア＝植物のあしらい（ゴールド） -->
  <g stroke="#a4894c" stroke-width="1.8" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M398 350 C402 332 404 316 400 300"/>
  </g>
  <g fill="#a4894c" opacity="0.85">
    <path d="M400 312 C393 309 390 300 398 293 C405 300 407 309 400 312 Z"/>
    <path d="M401 330 C408 327 412 319 405 311 C398 317 396 326 401 330 Z"/>
    <path d="M399 344 C392 341 389 333 397 326 C404 333 405 341 399 344 Z"/>
  </g>

  <!-- 左下にも小さな芽 -->
  <g fill="#a4894c" opacity="0.7">
    <path d="M104 350 C97 347 94 339 102 332 C109 339 110 347 104 350 Z"/>
  </g>
  <g stroke="#a4894c" stroke-width="1.6" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M104 358 C104 350 104 344 104 338"/>
  </g>
</svg>
